name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Change detection ----
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'apps/**/**.go'
              - 'packages/**/**.go'
              - 'go.work'
              - '**/go.mod'
              - '**/go.sum'
            frontend:
              - 'apps/user-frontend/**'
              - 'apps/admin-frontend/**'
              - 'packages/contracts/ts/**'
              - 'packages/frontend-shared/**'
            infra:
              - 'infra/**'
              - '**/Dockerfile'
              - 'docker-compose*.yml'

  # ---- Go jobs (skipped if no Go changes) ----
  lint-and-test-go:
    name: Go (lint, test, build)
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: Install golangci-lint
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh |
            sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          golangci-lint version
      - name: Lint
        env:
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t modules < <(go work edit -json | jq -r '.Use[].DiskPath')

          if [ "${#modules[@]}" -eq 0 ]; then
            echo "::error::go.work contains no workspace modules"
            exit 1
          fi

          declare -A seen_modules=()
          for dir in "${modules[@]}"; do
            if [ -n "${seen_modules[$dir]+present}" ]; then
              echo "::error::go.work contains a duplicate workspace module: $dir"
              exit 1
            fi
            seen_modules["$dir"]=1

            if [ ! -d "$dir" ]; then
              echo "::error::go.work module directory does not exist: $dir"
              exit 1
            fi

            echo "Linting $dir..."
            if ! (
              cd "$dir"
              golangci-lint run \
                --timeout 5m \
                --new-from-rev="$LINT_BASE_REF" \
                ./...
            ); then
              echo "::error::golangci-lint failed for workspace module: $dir"
              exit 1
            fi
          done
      - name: Test
        env:
          ENVIRONMENT: test
          TEST_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t modules < <(go work edit -json | jq -r '.Use[].DiskPath')

          if [ "${#modules[@]}" -eq 0 ]; then
            echo "::error::go.work contains no workspace modules"
            exit 1
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$TEST_BASE_REF...HEAD" -- \
              '*.go' '**/go.mod' '**/go.sum' 'go.work'
          )

          declare -A seen_modules=()
          selected_modules=()
          for dir in "${modules[@]}"; do
            if [ -n "${seen_modules[$dir]+present}" ]; then
              echo "::error::go.work contains a duplicate workspace module: $dir"
              exit 1
            fi
            seen_modules["$dir"]=1

            if [ ! -d "$dir" ]; then
              echo "::error::go.work module directory does not exist: $dir"
              exit 1
            fi

            prefix="${dir#./}/"
            for file in "${changed_files[@]}"; do
              if [ "$file" = "go.work" ] || [[ "$file" == "$prefix"* ]]; then
                selected_modules+=("$dir")
                break
              fi
            done
          done

          if [ "${#selected_modules[@]}" -eq 0 ]; then
            echo "::error::no workspace module selected for changed Go inputs"
            exit 1
          fi

          for dir in "${selected_modules[@]}"; do
            echo "Testing changed module $dir..."
            (
              cd "$dir"
              go test -short -race -count=1 ./...
            )
          done
      - name: Build
        run: |
          mapfile -t modules < <(go work edit -json | jq -r '.Use[].DiskPath')

          if [ "${#modules[@]}" -eq 0 ]; then
            echo "::error::go.work contains no workspace modules"
            exit 1
          fi

          declare -A seen_modules=()
          for dir in "${modules[@]}"; do
            if [ -n "${seen_modules[$dir]+present}" ]; then
              echo "::error::go.work contains a duplicate workspace module: $dir"
              exit 1
            fi
            seen_modules["$dir"]=1

            if [ ! -d "$dir" ]; then
              echo "::error::go.work module directory does not exist: $dir"
              exit 1
            fi

            echo "Building $dir..."
            (
              cd "$dir"
              go build ./...
            )
          done

  # ---- Frontend jobs (skipped if no frontend changes) ----
  lint-and-test-frontend:
    name: Frontend (lint, test, build)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tragge/user-frontend lint
      - run: pnpm --filter @tragge/admin-frontend lint
      - run: pnpm --filter @tragge/user-frontend build
      - run: pnpm --filter @tragge/admin-frontend build
