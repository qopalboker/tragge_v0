        # Admin auth endpoints - strictest rate limiting (3 req/min)
        # Covers /api/admin/auth/login and /api/admin/auth/2fa/login
        location ~ ^/api/admin/auth/ {
            limit_req zone=admin_auth_limit burst=3 nodelay;
