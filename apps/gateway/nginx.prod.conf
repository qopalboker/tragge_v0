        }

        # ===========================================
        # Payment Service Routes
        # ===========================================

        location /api/payments {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            # Security + rate limit headers
            include /etc/nginx/includes/security-headers.conf;
