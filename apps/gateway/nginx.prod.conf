worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Focused SEC-002 defense: never log reusable session credential aliases or
    # bounded WebSocket tickets. WebSocket query strings are fully suppressed.
    map $request_uri $sanitized_request_uri {
        ~*[?&](token|access_token|jwt|auth_token|session_token|ticket)=  "$uri?[REDACTED]";
        ~^(/ws/trade)\?                                                "$1?[REDACTED]";
        ~^(/ws/tournaments)\?                                          "$1?[REDACTED]";
        default                                                        $request_uri;
    }

    # Enhanced log format with request ID and security context
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $sanitized_request_uri $server_protocol" '
                    '$status $body_bytes_sent "[OMITTED]" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'rid=$request_id';

    # JSON log format for structured logging (ELK/Loki compatible)
    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request_method $sanitized_request_uri $server_protocol",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"[OMITTED]",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    # Sanitized JSON log format for WebSocket routes (strips auth tokens from URI)
    log_format ws_json escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request_method $sanitized_request_uri $server_protocol",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"[OMITTED]",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hide nginx version
    server_tokens off;

    # Temp paths for non-root operation
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    # ===========================================
    # Real IP Resolution (behind load balancer / ingress controller)
    # ===========================================
    # The checked-in baseline deliberately trusts no forwarding source. A
    # deployment must generate exact set_real_ip_from entries for its ingress;
    # broad RFC1918 trust is prohibited. Until then, the socket peer remains
    # authoritative and the distributed application policy fails safely.

    # ===========================================
    # Rate Limiting Zones (Production)
    # ===========================================

    # General API rate limit: 100 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Auth endpoints rate limit: 10 requests/minute per IP (stricter for login/register)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # WebSocket connection limit: 5 connections/minute per IP
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/m;

    # Admin auth endpoints rate limit: 3 requests/minute per IP (strictest)
    limit_req_zone $binary_remote_addr zone=admin_auth_limit:10m rate=3r/m;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ===========================================
    # Request Size Limits
    # ===========================================

    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # ===========================================
    # Security Headers Maps (Production)
    # ===========================================

    # Hardened Content-Security-Policy per frontend
    map $uri $csp_header {
        # User frontend - standard web app
        # ARCaptcha widget origins are whitelisted so the invisible captcha used
        # during registration/login can load its script and challenge iframe.
        ~^/user "default-src 'self'; script-src 'self' https://widget.arcaptcha.co; style-src 'self' 'unsafe-inline' https://widget.arcaptcha.co; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://$host https://widget.arcaptcha.co https://api.arcaptcha.co; frame-src 'self' https://widget.arcaptcha.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content";

        # Trade frontend - WebSocket-heavy
        ~^/trade "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://$host https://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content";

        # Admin frontend - most restrictive
        ~^/admin "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content; require-trusted-types-for 'script'";

        # API endpoints - minimal CSP
        ~^/api/ "default-src 'none'; frame-ancestors 'none'";

        # WebSocket endpoint
        ~^/ws/ "default-src 'none'; connect-src 'self'; frame-ancestors 'none'";

        # Default fallback
        # ARCaptcha origins included so Vite-built JS chunks served from /assets/
        # (which don't match ~^/user, ~^/trade, ~^/admin) can dynamically import
        # the captcha widget without a CSP violation.
        default "default-src 'self'; script-src 'self' https://widget.arcaptcha.co; style-src 'self' 'unsafe-inline' https://widget.arcaptcha.co; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://widget.arcaptcha.co https://api.arcaptcha.co; frame-src 'self' https://widget.arcaptcha.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    # ===========================================
    # CORS Origin Validation Map
    # ===========================================
    # Validates the Origin header against allowed origins.
    # Used for nginx-generated error responses (429, 413, 502) where
    # the request never reaches the BFF CORS middleware.
    # In production, update these to match your actual domain(s).

    map $http_origin $user_cors_origin {
        default "";
        "https://app.tragge.com" $http_origin;
    }

    map $http_origin $admin_cors_origin {
        default "";
        "https://admin.tragge.com" $http_origin;
    }

    map $uri $cors_origin {
        default $user_cors_origin;
        ~^/api/admin(?:/|$) $admin_cors_origin;
        ~^/(?:webhooks|callback)(?:/|$) "";
    }

    map $scheme $hsts_header {
        default "";
        https   "max-age=31536000; includeSubDomains";
    }

    # ===========================================
    # WebSocket Connection Upgrade Map
    # ===========================================
    # Sets Connection header to "upgrade" only when client sends Upgrade header.
    # Empty string for normal HTTP preserves upstream keepalive pooling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ===========================================
    # WebSocket Log Sanitization
    # ===========================================
    # Strip query parameters from WebSocket request URIs in logs.


    # ===========================================
    # Upstream Definitions (K8s service names)
    # ===========================================

    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream user_bff {
        server user-bff:8081;
        keepalive 32;
    }

    upstream trade_bff {
        server trade-bff:8082;
        keepalive 32;
    }

    upstream admin_bff {
        server admin-bff:8083;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:8091;
        keepalive 32;
    }

    upstream leaderboard_worker {
        server leaderboard-worker:8086;
        keepalive 32;
    }

    upstream shard_router {
        server shard-router:8090;
        keepalive 32;
    }

    # ===========================================
    # Main Server Block (Production with HTTPS)
    # ===========================================

    server {
        listen 8080;
        server_name _;

        # ===========================================
        # Security Headers (Production)
        # ===========================================
        #
        # IMPORTANT: These headers are inherited ONLY by location blocks
        # that do NOT define their own add_header directives. Any location
        # with add_header (e.g., rate-limit headers) must include
        # /etc/nginx/includes/security-headers.conf to retain these.

        # HSTS - Enforce HTTPS (1 year, include subdomains, preload)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # XSS Protection (legacy browsers)
        add_header X-XSS-Protection "0" always;

        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions Policy (restrict browser features)
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

        # Content Security Policy
        add_header Content-Security-Policy $csp_header always;

        # Cross-Origin headers for additional isolation
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Request ID for distributed tracing
        add_header X-Request-ID $request_id always;

        # Connection limit per IP
        limit_conn conn_limit 20;

        # ===========================================
        # Health Check Endpoint
        # ===========================================

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
            include /etc/nginx/includes/security-headers.conf;
        }

        # ===========================================
        # Frontend Routes
        # ===========================================

        location /user {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_cache_bypass $http_upgrade;
        }

        location /trade {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_cache_bypass $http_upgrade;
        }

        location /admin {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_cache_bypass $http_upgrade;
        }

        # ===========================================
        # Frontend Static Assets (Vite build + public/)
        # ===========================================
        # Vite emits hashed bundles at absolute /assets/*. Files from
        # apps/frontend/public/ (icons/, fonts/, splash/, charting_library/,
        # favicon.svg, manifest.json, browserconfig.xml, offline.html) are
        # copied to dist root and served at absolute paths — none of which
        # match /user, /trade, or /admin. Without explicit proxying they
        # fall through to the catch-all 404 at the bottom of the file.
        #
        # ^~ prefix gives these highest-precedence-after-exact-match, so
        # they are not re-evaluated against any regex location.

        location ^~ /assets/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # Vite filenames are content-hashed → safe to cache immutably.
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /icons/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /fonts/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /splash/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /charting_library/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        # Root-level public files (exact-match so they beat any regex).
        location = /favicon.ico {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /favicon.svg {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /robots.txt {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /sitemap.xml {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /manifest.json {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /browserconfig.xml {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /offline.html {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            access_log off;
        }

        # ===========================================
        # Avatar Static Files
        # ===========================================

        location /avatars/ {
            alias /var/www/avatars/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/includes/security-headers.conf;
            try_files $uri =404;
        }

        # ===========================================
        # Auth Routes (Strict Rate Limiting)
        # ===========================================

        location ~ ^/api/user/auth/(login|register|send-otp|verify-otp|register-phone)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            # Security + rate limit headers (include needed due to add_header inheritance)
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Policy "10;w=60" always;

            proxy_pass http://user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Smaller body size for auth requests
            client_max_body_size 16k;
        }

        # ===========================================
        # Google OAuth Routes
        # ===========================================

        location = /api/user/auth/google {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Policy "10;w=60" always;

            proxy_pass http://user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api/user/auth/google/callback {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Policy "10;w=60" always;

            proxy_pass http://user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            client_max_body_size 16k;
        }

        # ===========================================
        # Password Reset Routes (Strict Rate Limiting)
        # ===========================================

        location ~ ^/api/user/auth/forgot-password/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Policy "10;w=60" always;

            client_max_body_size 16k;

            proxy_pass http://user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # Verification endpoints — stricter rate limit (JWT required but DB queries are expensive)
        location ~ ^/api/user/auth/(send-verification|verify-code|verify-email|resend-verification)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;

            client_max_body_size 16k;

            proxy_pass http://user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # ===========================================
        # KYC Verification Routes (larger body for image uploads)
        # ===========================================

        location ~ ^/api/user/kyc/verify-(face|card)$ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 15m;

            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "100" always;
            add_header X-RateLimit-Policy "100;w=60" always;

            proxy_pass http://user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Manual KYC submit route (selfie + document upload — needs larger body size)
        location = /api/user/kyc/submit {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
