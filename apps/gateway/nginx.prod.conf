            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api/shard {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            # Security + rate limit headers
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "100" always;
            add_header X-RateLimit-Policy "100;w=60" always;

            proxy_pass http://shard_router/shard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ===========================================
        # WebSocket Route for Trade
        # ===========================================

        location /ws/trade {
            # Use sanitized log format to avoid logging auth tickets/tokens in URLs
            access_log /var/log/nginx/access.log ws_json;

            limit_req zone=ws_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://trade_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Pass through WebSocket extension headers
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

            # WebSocket specific timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # ===========================================
        # WebSocket Route for Tournament Feed
        # ===========================================

        location /ws/tournaments {
            # Use sanitized log format for WebSocket routes
            access_log /var/log/nginx/access.log ws_json;

            limit_req zone=ws_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://trade_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # WebSocket specific timeouts (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Disable buffering for real-time data
            proxy_buffering off;
        }

        # ===========================================
        # Error Pages
        # ===========================================
        # Custom error responses with CORS headers so browsers can read
        # nginx-generated errors (the request never reaches BFF CORS middleware).

        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please try again later."}';
        }

        error_page 413 /413.json;
        location = /413.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 413 '{"error":"payload_too_large","message":"Request body too large."}';
        }

        error_page 502 /502.json;
        location = /502.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 502 '{"error":"bad_gateway","message":"Service temporarily unavailable. Please try again later."}';
        }

        error_page 503 /503.json;
        location = /503.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable. Please try again later."}';
        }

        error_page 504 /504.json;
        location = /504.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 504 '{"error":"gateway_timeout","message":"Request timed out. Please try again later."}';
        }

        # ===========================================
        # Default Routes
        # ===========================================

        # Root redirect to user frontend (SPA routing).
        # Redirects to /user and lets the SPA router navigate to /login.
        # Intentionally different from dev config which redirects to
        # /user/login directly. See nginx.conf.
        location = / {
            return 302 /user;
        }

        # Catch-all: return 404
        location / {
            return 404;
        }
    }
}
