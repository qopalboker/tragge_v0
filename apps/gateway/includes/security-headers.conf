# Common security headers for API/location blocks that use add_header.
#
# nginx's add_header inheritance rule: if a location block defines ANY
# add_header directive, it does NOT inherit add_header directives from
# the parent server block. This include file must be added to every
# location that uses add_header (e.g., rate-limit headers) so that
# security headers are not silently dropped.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $csp_header always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
add_header X-Request-ID $request_id always;

# Cross-Origin isolation headers (must be duplicated here due to nginx
# add_header inheritance — location blocks with any add_header directive
# lose all server-level headers unless re-included).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS — only effective when served over TLS. Harmless to include in dev
# (browsers ignore it on plain HTTP). Production nginx.prod.conf sets
# max-age=31536000 with preload in the server block, but location blocks
# that include this file need it re-declared.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
