# CORS headers for nginx-generated error responses (429, 413, 502, etc.).
#
# When nginx itself generates a response (rate limiting, payload too large,
# upstream errors), the request never reaches the BFF CORS middleware.
# Without these headers, browsers block clients from reading the error.
#
# Requires the $cors_origin variable from the CORS origin map in nginx.conf.

add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-Request-ID, X-Contest-ID, X-Requested-With" always;
