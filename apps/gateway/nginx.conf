worker_processes 1;          # single core sufficient at early stage
worker_rlimit_nofile 1024;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;  # reduced from 1024 — sufficient for low traffic
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Focused SEC-002 defense: never log reusable session credential aliases or
    # bounded WebSocket tickets. WebSocket query strings are fully suppressed.
    map $request_uri $sanitized_request_uri {
        ~*[?&](token|access_token|jwt|auth_token|session_token|ticket)=  "$uri?[REDACTED]";
        ~^(/ws/trade)\?                                                "$1?[REDACTED]";
        ~^(/ws/tournaments)\?                                          "$1?[REDACTED]";
        default                                                        $request_uri;
    }

    # Enhanced log format with request ID
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $sanitized_request_uri $server_protocol" '
                    '$status $body_bytes_sent "[OMITTED]" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'rid=$request_id';

    # Buffered logging (reduces disk I/O)
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    sendfile on;
    keepalive_timeout 65;

    # Gzip API responses
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
    gzip_comp_level 1;

    # Hide nginx version
    server_tokens off;

    # Temp paths for non-root operation
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # ===========================================
    # Rate Limiting Zones
    # ===========================================

    # Dev-loose: 600 r/min (10 r/s) per IP. Headroom for widget-heavy pages
    # without being unrealistic. Production tuning lives in nginx.prod.conf
    # and stays at 100 r/min pending traffic measurement.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_auth_limit:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ===========================================
    # Request Size Limits
    # ===========================================

    client_max_body_size 1m;
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # ===========================================
    # CSP per panel — scoped tight because each panel now ships as its
    # own SPA. Admin CSP is stricter than user (no captcha widget, no
    # image hosts) because admin never renders user-submitted content.
    # ===========================================
    map $uri $csp_user {
        ~^/api/  "default-src 'none'; frame-ancestors 'none'";
        ~^/ws/   "default-src 'none'; connect-src 'self'; frame-ancestors 'none'";
        default  "default-src 'self'; script-src 'self' https://widget.arcaptcha.co; style-src 'self' 'unsafe-inline' https://widget.arcaptcha.co; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://$host ws://$host https://widget.arcaptcha.co https://api.arcaptcha.co; frame-src 'self' https://widget.arcaptcha.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";
    }

    map $uri $csp_admin {
        ~^/api/  "default-src 'none'; frame-ancestors 'none'";
        default  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; require-trusted-types-for 'script'";
    }

    # Shared include `includes/security-headers.conf` references $csp_header.
    # Resolve it to the per-panel CSP based on which server block is active.
    map $server_port $csp_header {
        8081     $csp_admin;
        default  $csp_user;
    }

    map $scheme $hsts_header {
        default "";
        https   "max-age=31536000; includeSubDomains";
    }

    # ===========================================
    # CORS Origin Validation Map
    # ===========================================
    map "$server_port|$http_origin" $cors_origin {
        default "";
        "8080|http://localhost:8080" $http_origin;
        "8080|http://127.0.0.1:8080" $http_origin;
        "8081|http://localhost:8081" $http_origin;
        "8081|http://127.0.0.1:8081" $http_origin;
    }

    # ===========================================
    # WebSocket Connection Upgrade Map
    # ===========================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Sanitized log format for WebSocket routes
    log_format ws_main '$remote_addr - $remote_user [$time_local] "$request_method $sanitized_request_uri $server_protocol" '
                       '$status $body_bytes_sent "[OMITTED]" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'rid=$request_id';

    # =========================================================
    # Shared proxy header defaults — applied via include below
    # =========================================================

    # =========================================================================
    # SERVER :8080 — User panel (user-frontend + user/trade APIs + WebSockets)
    # =========================================================================
    #
    # This server block must NOT proxy /api/admin/* — cross-panel API calls
    # return 404 so a leaked user bundle cannot call admin-bff via this
    # origin, even if CORS on admin-bff accidentally allowed it.
    server {
        listen 8080;
        absolute_redirect off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        server_name _;

        # Global security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
        add_header Content-Security-Policy $csp_user always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Request-ID $request_id always;

        limit_conn conn_limit 20;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
            include /etc/nginx/includes/security-headers.conf;
        }

        # ---------- Admin routes must not be reachable from this origin ----------
        # Any hit on /admin (frontend) or /api/admin/* (API) from the user
        # panel's hostname is a leak indicator. 404 is returned in-place so
        # the SPA's not-found route handles it.
        location ^~ /admin { return 404; }
        location ^~ /api/admin { return 404; }

        # ---------- Static assets — bypass rate-limiting ----------
        # Vite emits hashed bundles at absolute /assets/*. Other prefixes are
        # public/ files copied to the dist root. None of these may be rate-
        # limited or a fresh page load 503s halfway through and the gateway's
        # JSON error_page rewrites Content-Type → MIME violations in the
        # browser. The ^~ prefix locks longest-match and skips regex
        # evaluation. Mirrors nginx.prod.conf's /assets/ carve-out.
        location ^~ /assets/ {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /icons/ {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        # /fonts/ proxy retained for backward compatibility; current builds
        # emit fonts under /assets/ via Vite asset pipeline (Dana moved into
        # @tragge/frontend-shared with relative ./fonts/ url()s). Kept so any
        # straggling absolute /fonts/... reference still resolves; once we are
        # certain nothing references this prefix it can be removed.
        location ^~ /fonts/ {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /splash/ {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location ^~ /charting_library/ {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        # Root-level public files (exact match — beats any regex location)
        location = /favicon.ico {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /favicon.svg {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /robots.txt {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /sitemap.xml {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /manifest.json {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /browserconfig.xml {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /offline.html {
            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ---------- Frontend SPA ----------
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $user_frontend http://user-frontend:8080;
            proxy_pass $user_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Avatar static files (legacy path)
        location /avatars/ {
            alias /var/www/avatars/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/includes/security-headers.conf;
            try_files $uri =404;
        }

        location /uploads/ {
            alias /data/uploads/;
            expires 1d;
            add_header Cache-Control "public";
            include /etc/nginx/includes/security-headers.conf;
            try_files $uri =404;
        }

        # ---------- User auth (strict rate-limit) ----------
        location ~ ^/api/user/auth/(login|register|send-otp|verify-otp|register-phone)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Policy "10;w=60" always;

            client_max_body_size 16k;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }

        # Google OAuth
        location = /api/user/auth/google {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }

        location = /api/user/auth/google/callback {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;

            client_max_body_size 16k;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }

        location ~ ^/api/user/auth/forgot-password/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;

            client_max_body_size 16k;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/user/auth/(send-verification|verify-code|verify-email|resend-verification)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "10" always;

            client_max_body_size 16k;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_read_timeout 30s;
        }

        # KYC uploads
        location ~ ^/api/user/kyc/verify-(face|card)$ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 15m;
            include /etc/nginx/includes/security-headers.conf;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location = /api/user/kyc/submit {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 25m;
            include /etc/nginx/includes/security-headers.conf;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/user/me/tickets(/[a-f0-9-]+/messages)?$ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 15m;
            include /etc/nginx/includes/security-headers.conf;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/user {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "100" always;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        # Trade API — user panel talks to trade-bff (auth is user-bff only).
        location ~ ^/api/trade/auth { return 404; }

        location /api/trade {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;

            set $trade_bff http://trading-core:8082;
            proxy_pass $trade_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/tournaments {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;

            rewrite ^/api/tournaments(/.*)$ /tournaments$1 break;
            rewrite ^/api/tournaments$ /tournaments break;

            set $user_bff http://api-server:8081;
            proxy_pass $user_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        # Payment / wallet (user-side)
        location /api/payments {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;

            set $payment_service http://api-server:8091;
            proxy_pass $payment_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/wallet {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;

            set $payment_service http://api-server:8091;
            proxy_pass $payment_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location /webhooks {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            set $payment_service http://api-server:8091;
            proxy_pass $payment_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /callback/jibit {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            set $payment_service http://api-server:8091;
            proxy_pass $payment_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/leaderboard {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;

            rewrite ^/api/leaderboard(/.*)$ /api/v1/leaderboard$1 break;
            rewrite ^/api/leaderboard$ /api/v1/leaderboard break;

            set $leaderboard_worker http://leaderboard-worker:8086;
            proxy_pass $leaderboard_worker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        # WebSockets — user panel only
        location /ws/trade {
            access_log /var/log/nginx/access.log ws_main;
            limit_req zone=ws_limit burst=3 nodelay;
            limit_req_status 429;

            set $trade_bff http://trading-core:8082;
            proxy_pass $trade_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        location /ws/tournaments {
            access_log /var/log/nginx/access.log ws_main;
            limit_req zone=ws_limit burst=3 nodelay;
            limit_req_status 429;

            set $trade_bff http://trading-core:8082;
            proxy_pass $trade_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # Error pages
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please try again later."}';
        }
        error_page 413 /413.json;
        location = /413.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 413 '{"error":"payload_too_large","message":"Request body too large."}';
        }
        error_page 502 /502.json;
        location = /502.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 502 '{"error":"bad_gateway","message":"Service temporarily unavailable. Please try again later."}';
        }
        error_page 503 /503.json;
        location = /503.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable. Please try again later."}';
        }
        error_page 504 /504.json;
        location = /504.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 504 '{"error":"gateway_timeout","message":"Request timed out. Please try again later."}';
        }
    }

    # =========================================================================
    # SERVER :8081 — Admin panel (admin-frontend + admin API only)
    # =========================================================================
    #
    # No /api/user/*, /api/trade/*, /api/payments/*, /ws/* — this origin
    # exists only to serve the admin SPA and proxy /api/admin/*. Any other
    # API path returns 404 so an XSS-ed admin bundle cannot pivot into the
    # user backend.
    server {
        listen 8081;
        absolute_redirect off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        server_name _;

        # Global security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
        add_header Content-Security-Policy $csp_admin always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Request-ID $request_id always;

        limit_conn conn_limit 20;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
            include /etc/nginx/includes/security-headers.conf;
        }

        # ---------- Cross-panel leak shields ----------
        # Any hit on /api/user, /api/trade, /api/tournaments, /api/payments,
        # /api/wallet, /api/leaderboard, /webhooks, /ws/*, /user/*, /trade/*
        # from the admin hostname is a leak indicator. 404 in-place.
        location ^~ /api/user      { return 404; }
        location ^~ /api/trade     { return 404; }
        location ^~ /api/tournaments { return 404; }
        location ^~ /api/payments  { return 404; }
        location ^~ /api/wallet    { return 404; }
        location ^~ /api/leaderboard { return 404; }
        location ^~ /webhooks      { return 404; }
        location ^~ /ws            { return 404; }
        location ^~ /user          { return 404; }
        location ^~ /trade         { return 404; }
        location ^~ /callback      { return 404; }

        # ---------- Admin auth (strictest rate-limit) ----------
        location ~ ^/api/admin/auth/ {
            limit_req zone=admin_auth_limit burst=3 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "3" always;
            add_header X-RateLimit-Policy "3;w=60" always;

            client_max_body_size 16k;

            set $admin_bff http://api-server:8083;
            proxy_pass $admin_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        # Admin ticket message uploads (larger body for attachments)
        location ~ ^/api/admin/tickets/[a-f0-9-]+/messages$ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 15m;
            include /etc/nginx/includes/security-headers.conf;

            set $admin_bff http://api-server:8083;
            proxy_pass $admin_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/admin {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/includes/security-headers.conf;
            add_header X-RateLimit-Limit "100" always;

            set $admin_bff http://api-server:8083;
            proxy_pass $admin_bff;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Requested-With $http_x_requested_with;
            proxy_set_header Authorization $http_authorization;
        }

        # Admin avatar static (served by gateway directly)
        location /avatars/ {
            alias /var/www/avatars/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/includes/security-headers.conf;
            try_files $uri =404;
        }

        # ---------- Static assets — bypass rate-limiting ----------
        # Admin SPA's hashed bundles. Mirrors the carve-out applied to the
        # :8080 user block; admin's public/ has only favicon.svg, so no
        # /icons/, /fonts/, /splash/, /charting_library/ here.
        location ^~ /assets/ {
            set $admin_frontend http://admin-frontend:8080;
            proxy_pass $admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/includes/security-headers.conf;
        }

        location = /favicon.svg {
            set $admin_frontend http://admin-frontend:8080;
            proxy_pass $admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ---------- Frontend SPA (admin-frontend) ----------
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $admin_frontend http://admin-frontend:8080;
            proxy_pass $admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Error pages (same shapes as :8080 block)
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please try again later."}';
        }
        error_page 413 /413.json;
        location = /413.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 413 '{"error":"payload_too_large","message":"Request body too large."}';
        }
        error_page 502 /502.json;
        location = /502.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 502 '{"error":"bad_gateway","message":"Service temporarily unavailable. Please try again later."}';
        }
        error_page 503 /503.json;
        location = /503.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable. Please try again later."}';
        }
        error_page 504 /504.json;
        location = /504.json {
            internal;
            default_type application/json;
            include /etc/nginx/includes/cors-error-headers.conf;
            include /etc/nginx/includes/security-headers.conf;
            return 504 '{"error":"gateway_timeout","message":"Request timed out. Please try again later."}';
        }
    }
}
