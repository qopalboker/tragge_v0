<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark blue background -->
  <rect width="512" height="512" rx="64" fill="#0f172a"/>

  <!-- Trading chart line -->
  <path
    d="M128 352 L192 224 L288 288 L384 160"
    stroke="#3b82f6"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Data points -->
  <circle cx="128" cy="352" r="20" fill="#3b82f6"/>
  <circle cx="192" cy="224" r="20" fill="#3b82f6"/>
  <circle cx="288" cy="288" r="20" fill="#3b82f6"/>
  <circle cx="384" cy="160" r="20" fill="#3b82f6"/>

  <!-- Inner white highlights on data points -->
  <circle cx="128" cy="352" r="10" fill="white"/>
  <circle cx="192" cy="224" r="10" fill="white"/>
  <circle cx="288" cy="288" r="10" fill="white"/>
  <circle cx="384" cy="160" r="10" fill="white"/>
</svg>
