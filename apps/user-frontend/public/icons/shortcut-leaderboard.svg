<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Dark blue background -->
  <rect width="96" height="96" rx="12" fill="#0f172a"/>

  <!-- Bar chart representing leaderboard -->
  <!-- First bar (bronze/3rd) -->
  <rect x="20" y="52" width="16" height="24" rx="2" fill="#cd7f32"/>

  <!-- Second bar (gold/1st - tallest) -->
  <rect x="40" y="28" width="16" height="48" rx="2" fill="#ffd700"/>

  <!-- Third bar (silver/2nd) -->
  <rect x="60" y="40" width="16" height="36" rx="2" fill="#c0c0c0"/>

  <!-- Position numbers -->
  <text x="28" y="68" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
  <text x="68" y="56" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
</svg>
