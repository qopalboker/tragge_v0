# Grafana dashboard provisioning for tragge platform
apiVersion: 1

providers:
  - name: 'Tragge Dashboards'
    orgId: 1
    folder: 'Tragge'
    folderUid: 'tragge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
