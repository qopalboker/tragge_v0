# Loki configuration for tragge platform
# Log aggregation with 30-day retention and alerting support
# Last updated: January 2026

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# =============================================================================
# QUERY CONFIGURATION
# =============================================================================
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
  # Parallelize queries for better performance
  parallelise_shardable_queries: true
  max_retries: 3

querier:
  # Allow queries up to 30 days
  max_concurrent: 10
  query_timeout: 5m
  engine:
    timeout: 5m

frontend:
  # Query splitting for large time ranges
  max_outstanding_per_tenant: 2048
  compress_responses: true

# =============================================================================
# SCHEMA CONFIGURATION
# =============================================================================
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    cache_ttl: 24h

# =============================================================================
# COMPACTOR - Handles retention enforcement
# =============================================================================
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  shared_store: filesystem

# =============================================================================
# LIMITS CONFIGURATION
# =============================================================================
limits_config:
  # Ingestion limits
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days - reject logs older than this
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 24
  max_streams_per_user: 10000
  max_line_size: 256kb
  max_entries_limit_per_query: 5000

  # Query limits
  max_query_length: 720h  # 30 days max query range
  max_query_parallelism: 32
  max_query_series: 500

  # Retention - 30 days for all logs
  retention_period: 720h  # 30 days

  # Per-stream retention (optional, for different retention per label)
  retention_stream:
    # Keep error logs for 60 days
    - selector: '{level="error"}'
      priority: 1
      period: 1440h  # 60 days
    # Keep warning logs for 30 days
    - selector: '{level="warn"}'
      priority: 2
      period: 720h  # 30 days
    # Keep info/debug logs for 14 days (save storage)
    - selector: '{level=~"info|debug"}'
      priority: 3
      period: 336h  # 14 days

  # Structured metadata (requires Loki 3.0+ with schema v13)
  allow_structured_metadata: false

# =============================================================================
# RULER - Log-based alerting
# =============================================================================
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true
  # Evaluation interval for alerting rules
  evaluation_interval: 1m
  # How long to wait before sending notifications
  alertmanager_refresh_interval: 1m
  # WAL for in-flight alerts during restarts
  wal:
    dir: /loki/ruler-wal
    truncate_frequency: 1h
    min_age: 5m
    max_age: 4h

# =============================================================================
# TABLE MANAGER (deprecated but kept for compatibility)
# =============================================================================
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h  # 30 days

# =============================================================================
# ANALYTICS
# =============================================================================
analytics:
  reporting_enabled: false

# =============================================================================
# INGESTER CONFIGURATION
# =============================================================================
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
