# Prometheus configuration for tragge platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tragge-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

# Rule files - alerting and recording rules
rule_files:
  - "rules/alerts.yml"
  - "rules/recording.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Go Services - User BFF
  - job_name: 'user-bff'
    static_configs:
      - targets: ['user-bff:8081']
        labels:
          service: 'user-bff'
          team: 'platform'
    metrics_path: /metrics

  # Go Services - Admin BFF
  - job_name: 'admin-bff'
    static_configs:
      - targets: ['admin-bff:8083']
        labels:
          service: 'admin-bff'
          team: 'platform'
    metrics_path: /metrics

  # Go Services - Trade BFF
  - job_name: 'trade-bff'
    static_configs:
      - targets: ['trade-bff:8082']
        labels:
          service: 'trade-bff'
          team: 'platform'
    metrics_path: /metrics

  # Go Services - Market Ingestor
  - job_name: 'market-ingestor'
    static_configs:
      - targets: ['market-ingestor:8084']
        labels:
          service: 'market-ingestor'
          team: 'platform'
    metrics_path: /metrics

  # Go Services - Trading Engine
  - job_name: 'trading-engine'
    static_configs:
      - targets: ['trading-engine:8085']
        labels:
          service: 'trading-engine'
          team: 'platform'
    metrics_path: /metrics

  # Go Services - Leaderboard Worker
  - job_name: 'leaderboard-worker'
    static_configs:
      - targets: ['leaderboard-worker:8086']
        labels:
          service: 'leaderboard-worker'
          team: 'platform'
    metrics_path: /metrics

  # Go Services - Contest Scheduler
  - job_name: 'contest-scheduler'
    static_configs:
      - targets: ['contest-scheduler:8087']
        labels:
          service: 'contest-scheduler'
          team: 'platform'
    metrics_path: /metrics

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          service: 'redpanda'
          team: 'infrastructure'
    metrics_path: /public_metrics

  # Redis metrics (standalone)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          team: 'infrastructure'
          mode: 'standalone'

  # Redis Sentinel metrics (when using Sentinel HA)
  # Uncomment when using Redis Sentinel
  # - job_name: 'redis-sentinel'
