  # ==========================================================================

  # PostgreSQL - Single instance for Docker Compose environments
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          team: 'infrastructure'
          role: 'primary'
    metrics_path: /metrics

