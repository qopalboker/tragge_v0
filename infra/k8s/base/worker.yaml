apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tragge
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tragge-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: tragge-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: worker
          image: tragge/worker:latest
          ports:
            - name: leaderboard
              containerPort: 8086
            - name: settlement
              containerPort: 8087
            - name: scheduler
              containerPort: 8088
            - name: generator
              containerPort: 8089
          envFrom:
            - configMapRef:
                name: tragge-config
          env:
            - name: DB_MAX_OPEN_CONNS
              value: "10"
            - name: DB_MAX_IDLE_CONNS
              value: "3"
            - name: GOGC
              value: "50"
            - name: GOMEMLIMIT
              value: "150MiB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: leaderboard
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: leaderboard
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: tragge
  labels:
    app.kubernetes.io/name: worker
spec:
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: leaderboard
      port: 8086
      targetPort: 8086
    - name: settlement
      port: 8087
      targetPort: 8087
    - name: scheduler
      port: 8088
      targetPort: 8088
    - name: generator
      port: 8089
      targetPort: 8089
