# =============================================================================
# WARNING: This file contains PLACEHOLDER values only.
# In production, use ExternalSecrets operator — never commit real secrets.
# See docs/SECURE_KEY_MANAGEMENT.md for production secret management.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tragge-secrets
  namespace: tragge
  labels:
    app.kubernetes.io/name: tragge
    app.kubernetes.io/part-of: tragge-platform
  annotations:
    # Credential security guidelines
    description: "Application secrets - MUST be replaced before production deployment"
type: Opaque
stringData:
  # ==========================================================================
  # JWT AUTHENTICATION SECRET
  # ==========================================================================
  # SECURITY: Generate a strong random secret (minimum 256 bits)
  #   openssl rand -base64 32
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET_minimum_32_characters"

  # ==========================================================================
  # MARKET DATA API KEYS
  # ==========================================================================
  TWELVEDATA_API_KEY: ""
  MASSIVE_API_KEY: ""

  # ==========================================================================
  # NOTIFICATION SECRETS
  # ==========================================================================
  # SECURITY: These are placeholder values. DO NOT deploy to production!
  #
  # Discord Webhook URL for sending notifications
  # Create a webhook in your Discord server: Server Settings > Integrations > Webhooks
  DISCORD_WEBHOOK_URL: "REPLACE_WITH_DISCORD_WEBHOOK_URL"

  # Resend API Key for email notifications
  # Get your API key from: https://resend.com/api-keys
  RESEND_API_KEY: "REPLACE_WITH_RESEND_API_KEY"

  # ==========================================================================
  # GOOGLE OAUTH CREDENTIALS
  # ==========================================================================
  # SECURITY: Get your OAuth credentials from Google Cloud Console
  # https://console.cloud.google.com/apis/credentials
  #
  # Create an OAuth 2.0 Client ID (Web application type)
  # Configure authorized redirect URIs for your environment
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"

  # ==========================================================================
  # SENTRY ERROR TRACKING
  # ==========================================================================
  # SECURITY: Get your DSN from your Sentry project settings
  # https://sentry.io/settings/projects/{project}/keys/
  SENTRY_DSN: ""

  # ==========================================================================
  # KAVENEGAR SMS API KEY
  # ==========================================================================
  # SECURITY: Get your API key from KaveNegar dashboard
  KAVENEGAR_API_KEY: "REPLACE_WITH_KAVENEGAR_API_KEY"

  # ==========================================================================
  # S3/MINIO STORAGE CREDENTIALS
  # ==========================================================================
  # SECURITY: Use IAM roles in production (EKS IRSA) instead of static credentials.
  # These are placeholders for non-IAM deployments.
  S3_ACCESS_KEY: "REPLACE_WITH_S3_ACCESS_KEY"
  S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY"

  # ==========================================================================
  # REDIS AUTHENTICATION
  # ==========================================================================
  # SECURITY: Generate a strong random password (minimum 32 characters)
  #   openssl rand -base64 32
  REDIS_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_32_characters"
# =============================================================================
# WARNING: PLACEHOLDER values only — see docs/SECURE_KEY_MANAGEMENT.md
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: tragge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tragge-platform
  annotations:
    description: "PostgreSQL credentials - MUST be replaced before production deployment"
type: Opaque
stringData:
  # ==========================================================================
  # POSTGRESQL DATABASE CONFIGURATION
  # ==========================================================================
  POSTGRES_DB: "app"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: "require"

  # ==========================================================================
  # POSTGRESQL CREDENTIALS - ROLE-BASED ACCESS
  # ==========================================================================
  # SECURITY WARNING: These are placeholder values!
  #
  # For production deployments:
  # 1. Generate strong passwords: ./scripts/secrets/generate-db-credentials.sh
  # 2. Use Kubernetes External Secrets or Sealed Secrets
  # 3. Implement credential rotation (see docs/runbook/credential-rotation.md)
  # 4. Enable SSL: sslmode=require or sslmode=verify-full
  #
  # Generate credentials with:
  #   ./scripts/secrets/generate-db-credentials.sh --k8s
  #
  # --------------------------------------------------------------------------
  # Admin User (for migrations and DDL operations)
  # --------------------------------------------------------------------------
  POSTGRES_ADMIN_USER: "tragge_admin"
  POSTGRES_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_48_characters"

  # --------------------------------------------------------------------------
  # Application User (for normal service operations)
  # --------------------------------------------------------------------------
  POSTGRES_APP_USER: "tragge_app"
  POSTGRES_APP_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_48_characters"

  # --------------------------------------------------------------------------
  # Read-Only User (for replica connections and reporting)
  # --------------------------------------------------------------------------
  POSTGRES_READONLY_USER: "tragge_readonly"
  POSTGRES_READONLY_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_48_characters"

  # --------------------------------------------------------------------------
  # Replication User (for streaming replication - optional)
  # --------------------------------------------------------------------------
  POSTGRES_REPLICATION_USER: "tragge_replication"
  POSTGRES_REPLICATION_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_48_characters"

  # --------------------------------------------------------------------------
  # PgBouncer Auth User (for connection pooling)
  # --------------------------------------------------------------------------
  PGBOUNCER_AUTH_USER: "pgbouncer_auth"
  PGBOUNCER_AUTH_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_32_characters"

  # --------------------------------------------------------------------------
  # Legacy compatibility (deprecated - use role-based users instead)
  # --------------------------------------------------------------------------
  POSTGRES_USER: "tragge_app"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD_minimum_48_characters"
