# ===========================================
# External Secrets Configuration for Tragge
# ===========================================
# This file defines ExternalSecret resources that sync secrets
# from an external secret manager (AWS Secrets Manager, GCP Secret Manager,
# HashiCorp Vault, etc.) to Kubernetes secrets.
#
# Prerequisites:
# 1. Install External Secrets Operator in your cluster:
#    kubectl apply -f https://raw.githubusercontent.com/external-secrets/external-secrets/main/deploy/crds/bundle.yaml
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets
#
# 2. Configure a SecretStore or ClusterSecretStore for your provider
#
# Usage:
# - Store secrets in your external secret manager with the keys defined below
# - Apply this file: kubectl apply -f external-secrets.yaml
# - Secrets will be automatically synced to Kubernetes

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: tragge-secret-store
spec:
  # AWS Secrets Manager example (uncomment and configure for your provider)
  # provider:
  #   aws:
  #     service: SecretsManager
  #     region: us-east-1
  #     auth:
  #       jwt:
  #         serviceAccountRef:
  #           name: external-secrets
  #           namespace: external-secrets

  # GCP Secret Manager example
  # provider:
  #   gcpsm:
  #     projectID: your-gcp-project-id
  #     auth:
  #       workloadIdentity:
  #         clusterLocation: us-central1
  #         clusterName: your-cluster
  #         serviceAccountRef:
  #           name: external-secrets
  #           namespace: external-secrets

  # HashiCorp Vault (uncomment and configure with your actual Vault URL)
  # WARNING: Replace vault.example.com with your actual Vault server before enabling
  # provider:
  #   vault:
  #     server: "https://vault.example.com"
  #     path: "secret"
  #     version: "v2"
  #     auth:
  #       kubernetes:
  #         mountPath: "kubernetes"
  #         role: "tragge-app"
  #         serviceAccountRef:
  #           name: "external-secrets"
  #           namespace: "external-secrets"

---
# ===========================================
# Database Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-database-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-database-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_DSN: "{{ .postgres_dsn }}"
  data:
    - secretKey: postgres_dsn
      remoteRef:
        key: tragge/production/database
        property: dsn

---
# ===========================================
# Redis Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-redis-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-redis-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_ADDR: "{{ .redis_addr }}"
        REDIS_PASSWORD: "{{ .redis_password }}"
  data:
    - secretKey: redis_addr
      remoteRef:
        key: tragge/production/redis
        property: addr
    - secretKey: redis_password
      remoteRef:
        key: tragge/production/redis
        property: password

---
# ===========================================
# Kafka Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-kafka-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-kafka-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KAFKA_BROKERS: "{{ .kafka_brokers }}"
        KAFKA_USERNAME: "{{ .kafka_username }}"
        KAFKA_PASSWORD: "{{ .kafka_password }}"
  data:
    - secretKey: kafka_brokers
      remoteRef:
        key: tragge/production/kafka
        property: brokers
    - secretKey: kafka_username
      remoteRef:
        key: tragge/production/kafka
        property: username
    - secretKey: kafka_password
      remoteRef:
        key: tragge/production/kafka
        property: password

---
# ===========================================
# Authentication Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-auth-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-auth-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: tragge/production/auth
        property: jwt_secret

---
# ===========================================
# Market Data Provider Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-market-data-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-market-data-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Primary API keys
        TWELVEDATA_API_KEY: "{{ .twelvedata_api_key }}"
        MASSIVE_API_KEY: "{{ .massive_api_key }}"
        # Rotation keys (for zero-downtime key rotation)
        TWELVEDATA_API_KEY_ALT: "{{ .twelvedata_api_key_alt }}"
        MASSIVE_API_KEY_ALT: "{{ .massive_api_key_alt }}"
  data:
    - secretKey: twelvedata_api_key
      remoteRef:
        key: tragge/production/market-data
        property: twelvedata_api_key
    - secretKey: massive_api_key
      remoteRef:
        key: tragge/production/market-data
        property: massive_api_key
    - secretKey: twelvedata_api_key_alt
      remoteRef:
        key: tragge/production/market-data
        property: twelvedata_api_key_alt
    - secretKey: massive_api_key_alt
      remoteRef:
        key: tragge/production/market-data
        property: massive_api_key_alt

---
# ===========================================
# Notification Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-notification-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-notification-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DISCORD_WEBHOOK_URL: "{{ .discord_webhook_url }}"
        RESEND_API_KEY: "{{ .resend_api_key }}"
  data:
    - secretKey: discord_webhook_url
      remoteRef:
        key: tragge/production/notifications
        property: discord_webhook_url
    - secretKey: resend_api_key
      remoteRef:
        key: tragge/production/notifications
        property: resend_api_key

---
# ===========================================
# Observability Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-observability-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-observability-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .otlp_endpoint }}"
        OTEL_EXPORTER_OTLP_HEADERS: "{{ .otlp_headers }}"
  data:
    - secretKey: otlp_endpoint
      remoteRef:
        key: tragge/production/observability
        property: otlp_endpoint
    - secretKey: otlp_headers
      remoteRef:
        key: tragge/production/observability
        property: otlp_headers

---
# ===========================================
# Sentry Error Tracking Secrets
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-sentry-secrets
  namespace: tragge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-sentry-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SENTRY_DSN: "{{ .sentry_dsn }}"
  data:
    - secretKey: sentry_dsn
      remoteRef:
        key: tragge/production/sentry
        property: dsn

---
# ===========================================
# TLS Certificates
# ===========================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tragge-tls-secrets
  namespace: tragge
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: tragge-secret-store
    kind: ClusterSecretStore
  target:
    name: tragge-tls-secrets
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls_cert | b64dec }}"
        tls.key: "{{ .tls_key | b64dec }}"
  data:
    - secretKey: tls_cert
      remoteRef:
        key: tragge/production/tls
        property: certificate
    - secretKey: tls_key
      remoteRef:
        key: tragge/production/tls
        property: private_key

---
# ===========================================
# Non-Sensitive Configuration Note
# ===========================================
# Non-sensitive configuration is managed in base/configmap.yaml
# Do NOT duplicate ConfigMaps here - use Kustomize overlays for
# environment-specific overrides.
#
# For production, the production overlay's configMapGenerator
# will merge with the base ConfigMap as needed.
