apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-core
  namespace: tragge
  labels:
    app.kubernetes.io/name: trading-core
    app.kubernetes.io/component: trading
    app.kubernetes.io/part-of: tragge-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-core
        app.kubernetes.io/component: trading
        app.kubernetes.io/part-of: tragge-platform
      annotations:
        nginx.ingress.kubernetes.io/affinity: "cookie"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: trading-core
          image: tragge/trading-core:latest
          ports:
            - name: trade-bff
              containerPort: 8082
            - name: market-ingestor
              containerPort: 8084
            - name: trading-engine
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: tragge-config
          env:
            - name: DB_MAX_OPEN_CONNS
              value: "20"
            - name: DB_MAX_IDLE_CONNS
              value: "10"
            - name: GOGC
              value: "80"
            - name: GOMEMLIMIT
              value: "400MiB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: trade-bff
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: trade-bff
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trading-core
  namespace: tragge
  labels:
    app.kubernetes.io/name: trading-core
spec:
  selector:
    app.kubernetes.io/name: trading-core
  ports:
    - name: trade-bff
      port: 8082
      targetPort: 8082
    - name: market-ingestor
      port: 8084
      targetPort: 8084
    - name: trading-engine
      port: 8085
      targetPort: 8085
