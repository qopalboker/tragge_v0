apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tragge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tragge-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      initContainers:
        # Init container to set up SSL certificates (if using verify-full)
        - name: init-ssl
          image: alpine:3.19
          command: ['sh', '-c']
          args:
            - |
              if [ -f /ssl-certs/server.crt ]; then
                cp /ssl-certs/server.crt /var/lib/postgresql/ssl/
                cp /ssl-certs/server.key /var/lib/postgresql/ssl/
                cp /ssl-certs/ca.crt /var/lib/postgresql/ssl/
                chmod 600 /var/lib/postgresql/ssl/server.key
                chown 70:70 /var/lib/postgresql/ssl/*
              fi
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl-certs
              readOnly: true
            - name: ssl-volume
              mountPath: /var/lib/postgresql/ssl
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Database configuration
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
            # Use admin user for initial setup
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_ADMIN_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_ADMIN_PASSWORD
            # PostgreSQL configuration for SSL
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
            # Additional users credentials (for init scripts)
            - name: TRAGGE_APP_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_APP_USER
            - name: TRAGGE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_APP_PASSWORD
            - name: TRAGGE_READONLY_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_READONLY_USER
            - name: TRAGGE_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_READONLY_PASSWORD
            - name: PGBOUNCER_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: PGBOUNCER_AUTH_USER
            - name: PGBOUNCER_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: PGBOUNCER_AUTH_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: ssl-volume
              mountPath: /var/lib/postgresql/ssl
              readOnly: true
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tragge_admin
                - -d
                - app
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tragge_admin
                - -d
                - app
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: ssl-certs
          secret:
            secretName: postgres-ssl-certs
            optional: true
        - name: ssl-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tragge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tragge-platform
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
