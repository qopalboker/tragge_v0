apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-secrets
  namespace: tragge
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: tragge-platform
    app.kubernetes.io/component: connection-pooler
type: Opaque
stringData:
  # PgBouncer authentication file
  # Format: "username" "password"
  #
  # Password format for scram-sha-256 auth_type:
  #   "SCRAM-SHA-256$<iterations>:<salt>$<storedKey>:<serverKey>"
  #
  # To get SCRAM hashes from PostgreSQL:
  #   SELECT rolname, rolpassword FROM pg_authid WHERE rolname IN ('app', 'postgres');
  #
  # IMPORTANT: Replace these placeholder values in production with SCRAM-SHA-256 hashes!
  # The password must match the PostgreSQL user password.
  #
  # Current setup uses:
  #   - Username: app
  #   - Password: REPLACE_WITH_STRONG_PASSWORD (from postgres-secrets)
  #
  # For postgres admin user:
  #   - Username: postgres
  #   - Password: <postgres superuser password>
  #
  userlist.txt: |
    "app" "SCRAM-SHA-256$4096:REPLACE_WITH_SALT$REPLACE_STORED_KEY:REPLACE_SERVER_KEY"
    "postgres" "SCRAM-SHA-256$4096:REPLACE_WITH_SALT$REPLACE_STORED_KEY:REPLACE_SERVER_KEY"

---
# Additional configuration for PgBouncer admin access
# This allows querying PgBouncer statistics via SQL interface
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-admin-guide
  namespace: tragge
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: tragge-platform
data:
  README.md: |
    # PgBouncer Admin Guide

    ## Accessing Admin Console

    The PgBouncer admin console is available through a special database named 'pgbouncer'.

    ```bash
    # From within the Kubernetes cluster
    psql -h pgbouncer -p 6432 -U postgres pgbouncer

    # From outside (using port-forward)
    kubectl port-forward -n tragge svc/pgbouncer 6432:6432
    psql -h localhost -p 6432 -U postgres pgbouncer
    ```

    ## Useful Admin Commands

    ### Show Statistics
    ```sql
    -- Show pool statistics
    SHOW POOLS;

    -- Show client connections
    SHOW CLIENTS;

    -- Show server connections
    SHOW SERVERS;

    -- Show databases
    SHOW DATABASES;

    -- Show statistics
    SHOW STATS;

    -- Show configuration
    SHOW CONFIG;

    -- Show active queries
    SHOW LISTS;
    ```

    ### Runtime Configuration
    ```sql
    -- Reload configuration
    RELOAD;

    -- Pause all activity
    PAUSE;

    -- Resume activity
    RESUME;

    -- Gracefully close all server connections
    SHUTDOWN;

    -- Set parameter
    SET pool_mode = transaction;
    ```

    ### Monitoring Queries

    ```sql
    -- Check pool utilization
    SELECT
      database,
      user,
      cl_active,
      cl_waiting,
      sv_active,
      sv_idle,
      sv_used,
      maxwait
    FROM pgbouncer.pools;

    -- Check for waiting clients (potential bottleneck)
    SELECT * FROM pgbouncer.pools WHERE cl_waiting > 0;

    -- Check server connection count
    SELECT database, COUNT(*) as conn_count
    FROM pgbouncer.servers
    WHERE state = 'active'
    GROUP BY database;
    ```

    ## Generating Passwords for userlist.txt

    ### MD5 Method (auth_type = md5)

    ```bash
    # For user "app" with password "mypassword"
    echo -n "mypasswordapp" | md5sum | awk '{print "md5"$1}'

    # For user "postgres" with password "adminpass"
    echo -n "adminpasspostgres" | md5sum | awk '{print "md5"$1}'
    ```

    ### SCRAM-SHA-256 Method (auth_type = scram-sha-256)

    ```sql
    -- Connect to PostgreSQL and run:
    SELECT rolname, rolpassword FROM pg_authid WHERE rolname IN ('app', 'postgres');
    ```

    Copy the SCRAM hashes to userlist.txt.

    ## Security Best Practices

    1. **Change default passwords**: Replace all placeholder passwords in production
    2. **Use SCRAM-SHA-256**: More secure than MD5 (requires PostgreSQL 10+)
    3. **Limit admin users**: Only grant admin_users to necessary accounts
    4. **Enable TLS**: For production, enable client_tls_sslmode and server_tls_sslmode
    5. **Network policies**: Restrict access to PgBouncer using Kubernetes NetworkPolicies
    6. **Monitor**: Set up alerts for high cl_waiting and pool exhaustion

    ## Troubleshooting

    ### Clients can't connect
    - Check userlist.txt passwords match PostgreSQL
    - Verify auth_type matches PostgreSQL settings
    - Check max_client_conn limit

    ### Slow queries
    - Check SHOW POOLS for high cl_waiting
    - Increase default_pool_size if needed
    - Check PostgreSQL performance

    ### Connection refused
    - Verify PgBouncer pod is running: `kubectl get pods -n tragge -l app.kubernetes.io/name=pgbouncer`
    - Check logs: `kubectl logs -n tragge -l app.kubernetes.io/name=pgbouncer`
    - Verify service exists: `kubectl get svc -n tragge pgbouncer`
