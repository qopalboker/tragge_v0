apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: tragge
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: tragge-platform
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.1.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
            - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
            - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr redpanda:33145
            - --advertise-rpc-addr redpanda:33145
            - --mode dev-container
            - --smp 1
            - --memory 1G
            - --default-log-level=info
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 8081
              name: schema-registry
            - containerPort: 8082
              name: http-proxy
            - containerPort: 9644
              name: admin
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - rpk cluster health | grep -E 'Healthy:.+true' || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - rpk cluster health | grep -E 'Healthy:.+true' || exit 1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: redpanda-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: tragge
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: tragge-platform
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
    - port: 8081
      targetPort: 8081
      name: schema-registry
    - port: 8082
      targetPort: 8082
      name: http-proxy
    - port: 9644
      targetPort: 9644
      name: admin
  selector:
    app.kubernetes.io/name: redpanda
