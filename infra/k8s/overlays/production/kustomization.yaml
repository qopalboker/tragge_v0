apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: tragge-production

# =============================================================================
# PRODUCTION NAMESPACE
# =============================================================================
namespace: tragge

# =============================================================================
# BASE RESOURCES
# =============================================================================
# Import all base manifests from the base directory
# postgres-ha.yaml provides Patroni HA cluster (replaces single-instance postgres)
resources:
  - ../../base
  - ../../base/postgres-ha.yaml

# =============================================================================
# COMPONENT PATCHES
# =============================================================================
# Modular production-specific configurations
components:
  # Anti-affinity rules for high availability
  - patches/anti-affinity.yaml
  # Enhanced resource allocations for production workloads
  - patches/resources.yaml
  # Container-level security contexts (least privilege)
  - patches/security-contexts.yaml
  # Production storage allocations (larger PVCs)
  - patches/storage.yaml

# =============================================================================
# REPLICA CONFIGURATION
# =============================================================================
# Production replica counts and resource overrides
patches:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Remove single-instance, replaced by postgres-ha.yaml
  # ---------------------------------------------------------------------------
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      $patch: delete
    target:
      kind: StatefulSet
      name: postgres
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      $patch: delete
    target:
      kind: Service
      name: postgres

  # ---------------------------------------------------------------------------
  # Critical Services - 3 replicas minimum
  # ---------------------------------------------------------------------------
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: trade-bff

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: gateway

  # ---------------------------------------------------------------------------
  # Important Services - 3 replicas
  # ---------------------------------------------------------------------------
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: user-bff

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: admin-bff

  # ---------------------------------------------------------------------------
  # Worker Services
  # ---------------------------------------------------------------------------
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: market-ingestor

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: leaderboard-worker

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: payment-service

  # ---------------------------------------------------------------------------
  # Frontend Service - 2 replicas (CDN handles most traffic)
  # ---------------------------------------------------------------------------
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: frontend

  # ---------------------------------------------------------------------------
  # Update HPA minimums to match replica counts
  # ---------------------------------------------------------------------------
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: trade-bff-hpa

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: user-bff-hpa

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: gateway-hpa

  # ---------------------------------------------------------------------------
  # Production Domain Configuration
  # ---------------------------------------------------------------------------
  # Update Ingress hosts to use production domain
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: tragge.io
      - op: replace
        path: /spec/rules/1/host
        value: api.tragge.io
      - op: replace
        path: /spec/rules/2/host
        value: ws.tragge.io
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - tragge.io
          - api.tragge.io
          - ws.tragge.io
    target:
      kind: Ingress
      name: tragge-ingress

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ws.tragge.io
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - ws.tragge.io
    target:
      kind: Ingress
      name: tragge-websocket-ingress

# =============================================================================
# IMAGE CONFIGURATION
# =============================================================================
# Use specific versioned tags in production - NEVER use :latest
# Update these during deployments via CI/CD
images:
  - name: tragge/user-bff
    newTag: v1.0.0
  - name: tragge/trade-bff
    newTag: v1.0.0
  - name: tragge/admin-bff
    newTag: v1.0.0
  - name: tragge/market-ingestor
    newTag: v1.0.0
  - name: tragge/trading-engine
    newTag: v1.0.0
  - name: tragge/leaderboard-worker
    newTag: v1.0.0
  - name: tragge/payment-service
    newTag: v1.0.0
  - name: tragge/settlement-service
    newTag: v1.0.0
  - name: tragge/free-contest-generator
    newTag: v1.0.0
  - name: tragge/frontend
    newTag: v1.0.0

# =============================================================================
# COMMON LABELS
# =============================================================================
commonLabels:
  environment: production
  managed-by: kustomize

# =============================================================================
# COMMON ANNOTATIONS
# =============================================================================
commonAnnotations:
  deployment/environment: production
  deployment/managed-by: kustomize

# =============================================================================
# CONFIGMAP GENERATOR
# =============================================================================
# Generate production-specific ConfigMap with environment overrides
configMapGenerator:
  - name: production-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
      - ENABLE_TRACING=true
      # Production Redis mode (Sentinel for HA)
      - REDIS_MODE=sentinel
      # OTEL configuration for production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_SERVICE_NAME_PREFIX=prod-
      # Google OAuth redirect URI for production domain
      - GOOGLE_REDIRECT_URI=https://api.tragge.io/api/user/auth/google/callback
