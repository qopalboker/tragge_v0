# =============================================================================
# PRODUCTION RESOURCE PATCHES
# =============================================================================
# Production-grade resource allocations with:
# - 2x the base requests and limits for critical services
# - Appropriate ratios for expected traffic
# - Memory and CPU tuned for production workloads
#
# These values should be tuned based on actual production metrics.
# Monitor with Prometheus/Grafana and adjust as needed.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # =============================================================================
  # TRADE-BFF - High resources for WebSocket connections
  # =============================================================================
  # WebSocket connections are memory-intensive; each connection maintains state
  # Expect 1000+ concurrent connections per pod in production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
    target:
      kind: Deployment
      name: trade-bff

  # =============================================================================
  # TRADING-ENGINE - High CPU for order processing
  # =============================================================================
  # Order processing is CPU-intensive; each shard handles thousands of orders
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
    target:
      kind: StatefulSet
      name: trading-engine

  # =============================================================================
  # USER-BFF - Moderate resources for auth
  # =============================================================================
  # Authentication with Argon2id is CPU-intensive; password hashing dominates
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
    target:
      kind: Deployment
      name: user-bff

  # =============================================================================
  # ADMIN-BFF - Lower resources (low traffic)
  # =============================================================================
  # Admin operations are infrequent; minimal resource needs
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
    target:
      kind: Deployment
      name: admin-bff

  # =============================================================================
  # MARKET-INGESTOR - Moderate for data processing
  # =============================================================================
  # Steady data flow from market providers; moderate resource needs
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
    target:
      kind: Deployment
      name: market-ingestor

  # =============================================================================
  # LEADERBOARD-WORKER - Higher for event processing
  # =============================================================================
  # Processes PnL events from Kafka; bursty during contest end
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
    target:
      kind: Deployment
      name: leaderboard-worker

  # =============================================================================
  # GATEWAY - Moderate for reverse proxy
  # =============================================================================
  # Nginx is efficient; moderate resources handle high traffic
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
    target:
      kind: Deployment
      name: gateway

  # =============================================================================
  # FRONTENDS - Minimal for static files
  # =============================================================================
  # Static file serving is efficient; minimal resources needed
  # CDN should handle most traffic in production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "200m"
    target:
      kind: Deployment
      name: frontend

  # =============================================================================
  # POSTGRESQL - Higher for production database
  # =============================================================================
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
    target:
      kind: StatefulSet
      name: postgres

  # =============================================================================
  # REDIS - Higher for production cache
  # =============================================================================
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
    target:
      kind: StatefulSet
      name: redis
